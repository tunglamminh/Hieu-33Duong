<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MT &amp; BN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #0c0920;
      --dusk: #1d1340;
      --rose: #ff5c93;
      --rose-deep: #e8386f;
      --blush: #ffc7da;
      --gold: #ffe6ad;
      --text: #f7eefb;
      --muted: #b9abd6;
      --glass: rgba(255, 255, 255, .07);
      --line: rgba(255, 255, 255, .16);
      --serif: "Cormorant Garamond", "Times New Roman", serif;
      --hand: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive;
      --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--text);
      background: radial-gradient(120% 90% at 50% 0%, var(--dusk) 0%, var(--night) 65%) fixed;
      overflow-x: hidden;
    }
    #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    .page {
      position: relative; z-index: 1;
      max-width: 560px; margin: 0 auto;
      padding: clamp(28px, 6vh, 64px) 20px 56px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }

    /* ---------- Tiêu đề ---------- */
    .year { margin: 0; font-weight: 300; font-size: 1rem; letter-spacing: .5em; text-indent: .5em; color: var(--muted); }
    .names {
      margin: .15em 0 0;
      font-family: var(--serif); font-style: italic; font-weight: 600;
      font-size: clamp(3rem, 14vw, 5.6rem); line-height: 1.05;
      background: linear-gradient(100deg, var(--blush), #fff 45%, var(--gold));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 22px rgba(255, 92, 147, .45));
    }
    .tagline { margin: .4em 0 0; font-weight: 300; font-size: 1.05rem; letter-spacing: .45em; text-indent: .45em; color: var(--blush); }
    .tagline .heart { color: var(--rose); letter-spacing: 0; }

    /* ---------- Ảnh + trái tim hạt ---------- */
    .stage { position: relative; width: min(80vw, 380px); aspect-ratio: 1; margin: clamp(14px, 3vh, 30px) 0 6px; }
    #heart { position: absolute; inset: 0; width: 100%; height: 100%; }
    .photo {
      position: absolute; left: 50%; top: 50%;
      width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%);
      border-radius: 50%; overflow: hidden;
      border: 2px solid rgba(255, 255, 255, .55);
      box-shadow: 0 0 0 6px rgba(255, 92, 147, .18), 0 10px 40px rgba(255, 92, 147, .45);
      background: var(--dusk);
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo .fallback { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3rem; color: var(--rose); }

    /* ---------- Nút ---------- */
    .btn {
      font: inherit; font-weight: 500; font-size: .98rem;
      border-radius: 999px; padding: .8em 1.6em; cursor: pointer;
      border: 1px solid transparent; color: var(--text);
      transition: transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible, .link-btn:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 2px solid var(--gold); outline-offset: 3px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--rose), var(--rose-deep)); box-shadow: 0 8px 26px rgba(255, 92, 147, .4); }
    .btn-primary:hover { box-shadow: 0 10px 34px rgba(255, 92, 147, .6); }
    .btn-ghost { background: transparent; border-color: var(--line); }
    .btn-ghost:hover { border-color: var(--blush); background: rgba(255, 255, 255, .06); }
    .link-btn { background: none; border: 0; padding: .2em .4em; font: inherit; font-size: .85rem; color: var(--muted); text-decoration: underline; cursor: pointer; }
    .link-btn:hover { color: var(--blush); }

    /* ---------- Giấy nhớ (sticky note) ---------- */
    .sticky {
      position: relative; width: 100%; padding: 28px 22px 14px;
      border-radius: 3px 3px 16px 3px; text-align: left;
      background: linear-gradient(160deg, #fff291, #ffdf5e);
      color: #4a3a10; font-family: var(--hand);
      box-shadow: 0 2px 2px rgba(0, 0, 0, .18), 0 18px 34px rgba(0, 0, 0, .45);
      transform: rotate(-1.6deg);
    }
    .tape {
      position: absolute; top: -13px; left: 50%; width: 96px; height: 27px;
      transform: translateX(-50%) rotate(3deg);
      background: rgba(255, 255, 255, .38); border: 1px solid rgba(255, 255, 255, .25);
    }
    .sticky textarea {
      display: block; width: 100%; min-height: 120px; margin: 0; padding: 0;
      border: 0; border-radius: 0; resize: none; outline: none;
      background: repeating-linear-gradient(to bottom, transparent 0 31px, rgba(110, 80, 10, .28) 31px 32px);
      background-attachment: local;
      color: #3f300a; font: inherit; font-size: 1.3rem; line-height: 32px;
      cursor: default;
    }
    .sticky-foot { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 10px; font-size: 1rem; color: rgba(74, 58, 16, .75); }
    .sign { margin: 0; min-height: 1.4em; font-size: 1.15rem; font-weight: bold; }

    .note-wrap { width: 100%; margin-top: 34px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .note-wrap .sticky { max-width: 400px; transform: rotate(1.4deg); }

    .answer-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; position: relative; margin-top: 10px; }
    .reply { margin: 0; max-width: 400px; font-size: .98rem; line-height: 1.6; color: var(--blush); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- Note trái tim cố định (chỉ đọc) ---------- */
    .love-note {
      position: relative; width: 100%; max-width: 400px; margin-top: 26px; padding: 32px 26px 20px;
      border-radius: 6px 6px 24px 6px; text-align: center; cursor: default;
      background: linear-gradient(160deg, #ffdeeb, #ffb5d0); color: #5a1f3b; font-family: var(--hand);
      box-shadow: 0 2px 2px rgba(0, 0, 0, .15), 0 16px 30px rgba(0, 0, 0, .4), 0 0 44px rgba(255, 92, 147, .28);
      transform: rotate(1.2deg);
    }
    .washi {
      position: absolute; top: -12px; left: 50%; width: 112px; height: 26px;
      transform: translateX(-50%) rotate(-3deg);
      background: repeating-linear-gradient(45deg, rgba(255, 255, 255, .8) 0 8px, rgba(255, 92, 147, .55) 8px 16px);
      opacity: .9;
    }
    .love-note .corner { position: absolute; color: var(--rose-deep); line-height: 1; }
    .love-note .tl { top: 10px; left: 14px; font-size: 1.2rem; animation: beat 1.4s ease-in-out infinite; }
    .love-note .tr { top: 12px; right: 16px; font-size: .8rem; opacity: .6; }
    .love-note .bl { bottom: 12px; left: 16px; font-size: .8rem; opacity: .6; }
    .love-note .br { bottom: 10px; right: 14px; font-size: 1.2rem; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.3); } 55% { transform: scale(1.05); } }
    .love-text { margin: 0; font-size: 1.4rem; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }
    .love-sign { margin: 12px 0 0; font-size: 1.15rem; color: #8a2f5c; }

    /* ---------- Popup mở đầu ---------- */
    dialog {
      width: min(92vw, 440px); max-height: 96vh; padding: 16px; border: 0;
      background: transparent; color: var(--text); overflow-x: hidden; overflow-y: auto;
    }
    dialog::backdrop { background: rgba(5, 3, 15, .92); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    dialog[open] .sticky { animation: drop .55s cubic-bezier(.2, .9, .3, 1.15); }
    @keyframes drop {
      from { opacity: 0; transform: translateY(-46px) rotate(-9deg) scale(.95); }
      to { opacity: 1; transform: translateY(0) rotate(-1.6deg) scale(1); }
    }
    .intro-body { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding-top: 10px; }
    .intro-body h2 { margin: 0; font-family: var(--serif); font-style: italic; font-weight: 600; font-size: clamp(1.9rem, 7vw, 2.5rem); text-shadow: 0 0 24px rgba(255, 92, 147, .5); }

    /* ---------- Toast + tim bay ---------- */
    #toast {
      position: fixed; left: 50%; bottom: 26px; z-index: 50;
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      padding: .7em 1.2em; border-radius: 999px; font-size: .9rem;
      background: rgba(255, 255, 255, .95); color: #2a1746;
      transition: opacity .25s ease, transform .25s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    .float-heart { position: fixed; bottom: -30px; z-index: 40; pointer-events: none; animation: rise linear forwards; }
    @keyframes rise { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }

    .footer { margin-top: 30px; font-size: .78rem; color: var(--muted); }
    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <main class="page">
    <p class="year" id="year"></p>
    <h1 class="names" id="names"></h1>
    <p class="tagline" id="tagline"></p>

    <div class="stage">
      <canvas id="heart" aria-hidden="true"></canvas>
      <div class="photo">
        <img id="photo" alt="Ảnh kỷ niệm">
        <div class="fallback" id="photoFallback" hidden>❤</div>
      </div>
    </div>

    <article class="love-note" id="loveNote" aria-label="Lời nhắn gửi bạn">
      <span class="washi" aria-hidden="true"></span>
      <span class="corner tl" aria-hidden="true">❤</span>
      <span class="corner tr" aria-hidden="true">❤</span>
      <span class="corner bl" aria-hidden="true">❤</span>
      <span class="corner br" aria-hidden="true">❤</span>
      <p class="love-text" id="loveText"></p>
      <p class="love-sign" id="loveSign"></p>
    </article>

    <button class="btn btn-primary" id="openPopup" type="button">Mở lời nhắn</button>

    <section class="note-wrap" aria-label="Giấy nhớ lời nhắn">
      <div class="sticky">
        <span class="tape" aria-hidden="true"></span>
        <label class="sr-only" for="pageNote">Lời nhắn</label>
        <textarea id="pageNote" readonly></textarea>
        <div class="sticky-foot">
          <p class="sign" id="pageSign"></p>
        </div>
      </div>
      <p class="reply" id="pageReply" hidden></p>
    </section>

    <p class="footer" id="footer"></p>
  </main>

  <dialog id="intro" aria-labelledby="qTitle">
    <div class="intro-body">
      <h2 id="qTitle"></h2>

      <div class="answer-row">
        <button class="btn btn-primary" id="yesBtn" type="button"></button>
        <button class="btn btn-ghost" id="noBtn" type="button"></button>
      </div>
      <button class="link-btn" id="skip" type="button">Để sau</button>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    "use strict";

    /* =====================================================
       ✏️ CHỈNH SỬA Ở ĐÂY — đổi chữ, ảnh, câu hỏi tại đây
       ===================================================== */
    const CONFIG = {
      year: "2026",
      names: "Hiếu & Dương",
      tagline: "Love ❤ You",
      photo: "EDIT_ME.png",            // đường dẫn ảnh (đặt cùng thư mục với index.html)
      footer: "Vắt cực khô trí não dành cho m <3",

      question: "T thích m,thấy m bị đối xử tệ,t đau lòng lắm,về đấy làm người yêu  t nhé... ",
      yesText: "Đồng ý",
      noText: "Không đồng ý",
      yesReply: "T thích m..",
      noReply: "T rất mong được có cơ hội có m",
      noRunsAway: true,               // Nút "Không đồng ý" tự chạy trốn khi di chuột vào

      // 💌 Lời nhắn cố định
      loveNote: {
        text: "T thích m,đồng í làm ngyeu t nhé?",
        sign: "— Đỗ Trung Hiếu <3 Dương"
      }
    };
    /* ===================================================== */

    const $ = (s) => document.querySelector(s);
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const store = {
      get(key, fallback) {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
        catch (e) { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); return true; }
        catch (e) { return false; }
      }
    };

    /* ---------- Đổ chữ vào trang ---------- */
    $("#year").textContent = CONFIG.year;
    $("#names").textContent = CONFIG.names;
    $("#tagline").textContent = CONFIG.tagline;
    $("#qTitle").textContent = CONFIG.question;
    $("#yesBtn").textContent = CONFIG.yesText;
    $("#noBtn").textContent = CONFIG.noText;
    $("#footer").textContent = CONFIG.footer;
    $("#loveText").textContent = CONFIG.loveNote.text;
    $("#loveSign").textContent = CONFIG.loveNote.sign;
    
    // Gán nội dung cố định vào ô giấy nhớ phía dưới
    $("#pageNote").value = CONFIG.loveNote.text;
    $("#pageSign").textContent = CONFIG.loveNote.sign;

    if (!CONFIG.loveNote.text) $("#loveNote").hidden = true;
    document.title = CONFIG.names;

    const photo = $("#photo");
    photo.addEventListener("error", () => { photo.hidden = true; $("#photoFallback").hidden = false; });
    photo.src = CONFIG.photo;

    /* ---------- Toast ---------- */
    const toast = $("#toast");
    let toastTimer;
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    /* ---------- Bầu trời sao ---------- */
    const sky = $("#sky"), sctx = sky.getContext("2d");
    let W, H, DPR, stars = [], shoots = [];

    function resizeSky() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      sky.width = W * DPR; sky.height = H * DPR;
      sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const n = Math.round((W * H) / 5500);
      stars = Array.from({ length: n }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.2 + 0.25,
        a: Math.random() * Math.PI * 2,
        s: Math.random() * 0.02 + 0.006,
        hue: Math.random() < 0.22 ? 335 : 230
      }));
    }

    function drawSky() {
      sctx.clearRect(0, 0, W, H);
      for (const s of stars) {
        if (!reduceMotion) s.a += s.s;
        const o = 0.35 + 0.65 * Math.abs(Math.sin(s.a));
        sctx.fillStyle = `hsla(${s.hue}, 85%, 90%, ${o})`;
        sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); sctx.fill();
      }
      if (!reduceMotion && Math.random() < 0.004 && shoots.length < 2) {
        shoots.push({ x: W * (0.3 + Math.random() * 0.7), y: Math.random() * H * 0.4, vx: -7 - Math.random() * 3, vy: 3 + Math.random() * 2, life: 1 });
      }
      shoots = shoots.filter((m) => m.life > 0);
      for (const m of shoots) {
        const g = sctx.createLinearGradient(m.x, m.y, m.x - m.vx * 7, m.y - m.vy * 7);
        g.addColorStop(0, `rgba(255, 230, 240, ${m.life})`);
        g.addColorStop(1, "rgba(255, 230, 240, 0)");
        sctx.strokeStyle = g; sctx.lineWidth = 1.6;
        sctx.beginPath(); sctx.moveTo(m.x, m.y); sctx.lineTo(m.x - m.vx * 7, m.y - m.vy * 7); sctx.stroke();
        m.x += m.vx; m.y += m.vy; m.life -= 0.018;
      }
    }

    /* ---------- Trái tim bằng hạt sáng ---------- */
    const hc = $("#heart"), hctx = hc.getContext("2d");
    let HS = 0;
    const particles = Array.from({ length: 360 }, () => ({
      t: Math.random() * Math.PI * 2,
      k: 0.85 + Math.random() * 0.28,
      a: Math.random() * Math.PI * 2,
      s: 0.01 + Math.random() * 0.03,
      size: Math.random() * 1.6 + 0.6,
      hue: 330 + Math.random() * 25,
      light: 68 + Math.random() * 20
    }));

    function resizeHeart() {
      HS = hc.getBoundingClientRect().width;
      hc.width = HS * DPR; hc.height = HS * DPR;
      hctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    function drawHeart(time) {
      hctx.clearRect(0, 0, HS, HS);
      const beat = reduceMotion ? 1 : 1 + 0.035 * Math.sin(time / 380) + 0.02 * Math.sin(time / 190);
      const s = (HS * 0.94 / 32) * beat;
      hctx.globalCompositeOperation = "lighter";
      for (const p of particles) {
        if (!reduceMotion) p.a += p.s;
        const x = 16 * Math.pow(Math.sin(p.t), 3);
        const y = 13 * Math.cos(p.t) - 5 * Math.cos(2 * p.t) - 2 * Math.cos(3 * p.t) - Math.cos(4 * p.t);
        const px = HS / 2 + x * s * p.k;
        const py = HS / 2 - (y + 3.5) * s * p.k;
        const o = 0.3 + 0.7 * Math.abs(Math.sin(p.a));
        hctx.fillStyle = `hsla(${p.hue}, 100%, ${p.light}%, ${o})`;
        hctx.beginPath(); hctx.arc(px, py, p.size, 0, Math.PI * 2); hctx.fill();
      }
      hctx.globalCompositeOperation = "source-over";
    }

    function resizeAll() { resizeSky(); resizeHeart(); }
    addEventListener("resize", resizeAll);
    resizeAll();

    function loop(time) { drawSky(); drawHeart(time); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);

    /* ---------- Popup mở đầu ---------- */
    const ANS_KEY = "lm.answer";
    const intro = $("#intro"), yesBtn = $("#yesBtn"), noBtn = $("#noBtn");
    const pageReply = $("#pageReply");

    function renderAnswer() {
      const a = store.get(ANS_KEY, null);
      pageReply.hidden = !a;
      if (a) pageReply.textContent = a.v === "yes" ? CONFIG.yesReply : CONFIG.noReply;
    }

    function openIntro() {
      document.body.style.overflow = "hidden";       // khoá cuộn trang phía sau
      intro.showModal();
    }
    intro.addEventListener("close", () => { document.body.style.overflow = ""; });
    $("#openPopup").addEventListener("click", openIntro);
    $("#skip").addEventListener("click", () => intro.close());

    function floatHearts() {
      if (reduceMotion) return;
      for (let i = 0; i < 26; i++) {
        const h = document.createElement("span");
        h.className = "float-heart";
        h.textContent = ["❤", "💖", "✨", "💗"][i % 4];
        h.style.left = Math.random() * 100 + "vw";
        h.style.fontSize = 16 + Math.random() * 22 + "px";
        h.style.animationDuration = 2.6 + Math.random() * 2.2 + "s";
        h.style.animationDelay = Math.random() * 0.8 + "s";
        document.body.append(h);
        setTimeout(() => h.remove(), 6000);
      }
    }

    function choose(value) {
      const ok = store.set(ANS_KEY, { v: value, t: Date.now() });
      renderAnswer();
      intro.close();
      showToast(ok ? "Đã chọn câu trả lời ❤" : "Không lưu được câu trả lời");
      if (value === "yes") floatHearts();
    }
    yesBtn.addEventListener("click", () => choose("yes"));
    noBtn.addEventListener("click", () => choose("no"));

    if (CONFIG.noRunsAway) {
      const dodge = () => {
        const dx = (Math.random() - 0.5) * 120, dy = (Math.random() - 0.5) * 50;
        noBtn.style.transform = `translate(${dx}px, ${dy}px)`;
      };
      noBtn.addEventListener("pointerenter", dodge);
      noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); dodge(); }, { passive: false });
    }

    /* Mở popup ngay khi vào trang */
    renderAnswer();
    openIntro();
  })();
  </script>
</body>
</html>
